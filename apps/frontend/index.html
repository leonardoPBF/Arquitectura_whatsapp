<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const theme = localStorage.getItem('lumina-theme');
        const dark = theme === 'dark' || ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
    <link rel="icon" type="image/png" href="https://i.ibb.co/9k50nCtb/Whats-App-Image-2025-11-13-at-1-47-03-AM-removebg-preview.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/9k50nCtb/Whats-App-Image-2025-11-13-at-1-47-03-AM-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LUMINA - Tu tienda online con los mejores productos" />
    <title>LUMINA - Tu Tienda Online</title>
  </head>
  <body>
    <div id="root">
      <div role="status" aria-live="polite" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:hsl(var(--background,48 25% 97%));color:hsl(var(--foreground,150 20% 18%));font-family:system-ui,sans-serif;text-align:center">
        <style>
          @keyframes lumina-spin { to { transform: rotate(360deg); } }
          .lumina-startup-spinner { width:48px;height:48px;border:4px solid #a7f3d0;border-top-color:#059669;border-radius:50%;animation:lumina-spin 1s linear infinite; }
          @media (prefers-reduced-motion: reduce) { .lumina-startup-spinner { animation:none; } }
        </style>
        <div class="lumina-startup-spinner" aria-hidden="true"></div>
        <strong style="font-size:24px">LUMINA</strong>
        <span>Cargando aplicación...</span>
      </div>
    </div>
    <noscript>Activa JavaScript en tu navegador para utilizar LUMINA.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
