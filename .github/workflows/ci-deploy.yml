name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, frontend, docs, whatsapp-bot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=${{ matrix.workspace }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  whatsapp-tests:
    name: WhatsApp lifecycle tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test --workspace=whatsapp-bot

  security-tests:
    name: API authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      PAYMENT_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test --workspace=api
      - run: npm test --workspace=frontend

  docker:
    name: Docker build and smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/docker-setup.cjs
      - uses: docker/setup-compose-action@v1
        with:
          version: v5.6.1
      - run: node scripts/docker-env-check.cjs
      - run: docker compose --env-file .env.production build
      - name: Browser launch without a WhatsApp session
        run: docker compose --env-file .env.production run --rm --no-deps whatsapp-bot node scripts/doctor.cjs --launch
      - name: Action security tests
        run: docker compose --env-file .env.production run --rm --no-deps -v "$PWD/apps/rasa-chatbot/tests:/tests:ro" --entrypoint python rasa-actions -m unittest discover -s /tests -p '*_test.py'
      - name: Validate Rasa data
        run: docker compose --env-file .env.production run --rm --no-deps --entrypoint rasa rasa-train data validate
      - name: Start internal services (no WhatsApp session)
        run: docker compose --env-file .env.production up -d --wait --wait-timeout 180 mongo api nginx rasa-actions
      - run: node scripts/docker-smoke.cjs
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.production logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.production down

  deploy:
    name: Deploy AWS Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - build
      - lint
      - whatsapp-tests
      - security-tests
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_HOST_KEYS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "$USER@$HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          cd /home/ubuntu/Arquitectura_whatsapp

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          docker compose \
            --env-file .env.production \
            build

          docker compose \
            --env-file .env.production \
            up -d --remove-orphans

          docker compose ps
          EOF

